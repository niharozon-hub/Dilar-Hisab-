<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7b45b5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ডিলার হিসাব</title>
<style>
:root{--pu:#7b45b5;--pd:#5b2f98;--bg:#f1ecf8;--bd:#e1d9ee;--tx:#2a2236;--mu:#8a7da0;--gr:#2f8f5b;--rd:#c94a4a;--or:#d9822b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100vw;touch-action:pan-x pan-y}
body{font-family:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;min-height:100vh}
.hide{display:none!important}
.big.d{background:#993C1D}.big.c{background:#3B6D11}.big.bar{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:16px 14px}.big.bar span{font-size:30px;line-height:1}
.fx th.r,.fx td.r{text-align:right;white-space:nowrap}.fx td.d{white-space:nowrap}tr.cl{cursor:pointer}select{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);font:inherit}
input,button{font:inherit}
input{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 3px}
.fg{margin-bottom:10px}
#wrap{max-width:760px;margin:0 auto;min-height:100vh;position:relative}
.top{background:var(--pu);color:#fff;padding:13px 16px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top .bk{background:none;border:0;color:#fff;font-size:22px;padding:0 6px 0 0}
.top small{margin-left:auto;font-weight:400;font-size:12px}
.pg{padding:12px 10px 100px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.big{border-radius:14px;padding:13px;color:#fff;margin-bottom:10px}.big small{display:block;font-size:12px;opacity:.9}.big b{font-size:24px}
.big.g{background:var(--gr)}.big.r{background:var(--rd)}.big.o{background:var(--or)}.big.p{background:var(--pu)}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.big b{overflow-wrap:anywhere}.two .big b{font-size:clamp(16px,5.2vw,22px)}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #e4dcf0;font-size:14px;align-items:center}.row:last-child{border:0}
.sub{font-size:12px;color:var(--mu)}.red{color:#c0392b;font-weight:700}.grn{color:#1d8a4f;font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--pu);color:#fff;text-align:center}
.btn.g{background:var(--gr)}.btn.o{background:#fff;color:var(--pu);border:1px solid #cdbbe6}.btn.r{background:#fff;color:var(--rd);border:1px solid #f0c0c0}
.btn.s{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5}
.srch{margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mu);font-size:11px;font-weight:600;padding:0 3px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 3px;border-bottom:1px solid #eee7f5;vertical-align:middle}
.nm{font-weight:700;color:var(--pd);cursor:pointer}
.tb{padding:0 3px;white-space:nowrap}
.ib{background:none;border:0;font-size:17px;padding:3px 5px;cursor:pointer}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:86px;width:52px;height:52px;border-radius:26px;background:var(--gr);color:#fff;font-size:30px;border:0;box-shadow:0 3px 9px #0004;z-index:8}
.nav{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:740px;bottom:10px;background:linear-gradient(#8d57cf,#5b2f98);border-radius:16px;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;border:2px solid #d8b872;z-index:9}
.nav button{background:none;border:0;color:#fff;font-size:13px;padding:7px 0;border-radius:11px;font-weight:600}
.nav button.act{background:rgba(255,255,255,.2)}
.mod{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:14px;max-height:92vh;overflow-y:auto}
.sheet h3{font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between}
.dd{background:#fff;border:1px solid var(--bd);border-radius:10px;max-height:190px;overflow-y:auto;margin-top:4px}
.dd div{padding:9px 11px;border-bottom:1px solid #f0eaf7;font-size:14px;display:flex;justify-content:space-between}
.irow{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed #e4dcf0}.irow .n{flex:2;font-size:13px}.irow input{width:70px;padding:7px}.irow .a{width:68px;text-align:right;font-size:13px;font-weight:700}
.err{color:var(--rd);font-size:13px;margin:6px 0}
.toast{position:fixed;left:12px;right:12px;bottom:84px;background:#1c2733;color:#fff;border-radius:10px;padding:11px 13px;z-index:40;font-size:14px;max-width:700px;margin:0 auto}
.ent{padding:9px 0;border-bottom:1px dashed #e4dcf0}.ent:last-child{border:0}
.ent .h{display:flex;justify-content:space-between;gap:8px}
#login{max-width:380px;margin:0 auto;padding:60px 20px}#login h1{text-align:center;color:var(--pd);margin-bottom:4px}
</style></head><body>
<div id="cfgErr" class="hide" style="padding:30px;color:var(--rd)">Firebase এর তথ্য (firebase-config.js) এখনো বসানো হয়নি।</div>
<div id="login" class="hide">
 <h1>ডিলার হিসাব</h1><p class="sub" style="text-align:center;margin-bottom:22px">ইমেইল ও পাসওয়ার্ড দিয়ে ঢুকুন</p>
 <div class="fg"><label>ইমেইল</label><input id="lgE" type="email" autocapitalize="none" autocomplete="username"></div>
 <div class="fg"><label>পাসওয়ার্ড</label><input id="lgP" type="password" autocomplete="current-password"></div>
 <div id="lgErr" class="err"></div>
 <button class="btn" style="width:100%" id="lgB" onclick="doLogin()">ঢুকুন</button>
 <p style="text-align:center;margin-top:14px"><a href="#" onclick="forgot();return false" style="color:var(--pu);font-size:14px">পাসওয়ার্ড ভুলে গেছেন?</a></p>
</div>
<div id="wrap" class="hide"><div class="top"><button class="bk hide" id="bk" onclick="back()">←</button><span id="ttl"></span><small id="net"></small></div><div id="pg" class="pg"></div><div id="nav" class="nav"></div></div>
<div id="modal" class="mod hide"></div>
<div id="toast" class="toast hide"></div>
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
'use strict';
var BN='০১২৩৪৫৬৭৮৯';
function bn(n){return String(n).replace(/\d/g,function(d){return BN[d]})}
function money(n){n=Math.round((+n||0)*100)/100;return '৳ '+bn(n.toLocaleString('en-IN'))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(i){return document.getElementById(i)}
function pad(n){return n<10?'0'+n:''+n}
function dkey(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dshow(k){var p=k.split('-');return bn(p[2]+'/'+p[1]+'/'+p[0])}
var toastT;function toast(m){var t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.add('hide')},3500)}
if(!window.FB_CFG||!FB_CFG.apiKey||/YOUR/.test(FB_CFG.apiKey)){$('cfgErr').classList.remove('hide')}
else{
firebase.initializeApp(FB_CFG);
var auth=firebase.auth(),db=firebase.firestore();
try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
var LD={},C={workers:[],dealers:[],entries:[],dentries:[]},P=[],U=null,base=null,unsubs=[],PAGE='home',PK='workers',PID=null,IID=null,FS='';
function ready(){return ['workers','dealers','products','entries','dentries'].every(function(c){return LD[c]})}
function unsub(){unsubs.forEach(function(u){try{u()}catch(e){}});unsubs=[]}
auth.onAuthStateChanged(function(u){
 unsub();$('login').classList.add('hide');$('wrap').classList.add('hide');
 if(!u){U=null;$('login').classList.remove('hide');return}
 U=u;LD={};C={workers:[],dealers:[],entries:[],dentries:[]};P=[];base=db.collection('users').doc(u.uid);$('wrap').classList.remove('hide');
 ['workers','dealers','products','entries','dentries'].forEach(function(c){LD[c]=false;unsubs.push(base.collection(c).onSnapshot(function(s){var a=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});if(c==='products')P=a;else C[c]=a;LD[c]=true;render()},function(){LD[c]=true;toast('ডেটা আনা যায়নি। ইন্টারনেট বা অনুমতি দেখুন');render()}))});
 go('home')
});
window.doLogin=function(){var e=$('lgE').value.trim(),p=$('lgP').value;$('lgErr').textContent='';if(!e||!p){$('lgErr').textContent='ইমেইল ও পাসওয়ার্ড দিন';return}
 $('lgB').disabled=true;auth.signInWithEmailAndPassword(e,p).catch(function(x){$('lgErr').textContent=x.code==='auth/network-request-failed'?'ইন্টারনেট নেই। প্রথমবার ঢুকতে ইন্টারনেট লাগবে':'ইমেইল বা পাসওয়ার্ড ভুল'}).then(function(){$('lgB').disabled=false})};
window.forgot=function(){var e=$('lgE').value.trim();if(!e){$('lgErr').textContent='আগে ওপরে ইমেইল লিখুন';return}auth.sendPasswordResetEmail(e).then(function(){$('lgErr').style.color='#1d8a4f';$('lgErr').textContent='ইমেইলে পাসওয়ার্ড বদলের লিংক গেছে। স্প্যাম ফোল্ডারও দেখুন'}).catch(function(){$('lgErr').style.color='';$('lgErr').textContent='ইমেইল পাঠানো গেল না। ইমেইল ঠিক আছে কি না দেখুন'})};
function netS(){$('net').textContent=navigator.onLine?'● অনলাইন':'● অফলাইন'}window.addEventListener('online',netS);window.addEventListener('offline',netS);netS();
setInterval(function(){if(PAGE==='home'&&U&&!document.hidden)render()},60000);

/* ---------- হিসাব ---------- */
var K={workers:{e:'entries'},dealers:{e:'dentries'}};
function num(n){return bn((Math.round((+n||0)*100)/100).toLocaleString('en-IN'))}
function find(k,id){return C[k].find(function(x){return x.id===id})}
function ents(k,id){return C[K[k].e].filter(function(e){return e.wid===id})}
function calc(k,p){var en=ents(k,p.id),inv=en.filter(function(e){return e.type==='invoice'}),pay=en.filter(function(e){return e.type==='payment'}),x=0,d=+p.opening||0,
 rows=inv.map(function(i){var pd=+i.paid||0;pay.forEach(function(q){if(String(q.inv)===String(i.no))pd+=+q.amount||0});d+=(+i.total||0)-pd;return {e:i,paid:pd,due:(+i.total||0)-pd}});
 pay.forEach(function(q){if(!inv.some(function(i){return String(i.no)===String(q.inv)}))x+=+q.amount||0});
 rows.sort(function(a,b){return (b.e.ts||0)-(a.e.ts||0)});return {rows:rows,due:d-x}}
function sorted(a,f){return a.slice().sort(function(x,y){return (x[f]||'').localeCompare(y[f]||'','bn')})}
/* ---------- পাতা ---------- */
var TABS=[['home','হোম'],['list','গ্রাহক'],['products','পণ্য'],['set','সেটিং']];
window.go=function(p,k,id,x){PAGE=p;if(k)PK=k;PID=id||null;IID=x||null;FS='';render()};
window.back=function(){if(PAGE==='inv')go('party',PK,PID);else if(PAGE==='party')go('list',PK);else go('home')};
function render(){
 if(!U)return;
 var dl=PK==='dealers'&&(PAGE==='list'||PAGE==='party'||PAGE==='inv'),tab=(PAGE==='home'||dl)?'home':(PAGE==='products'||PAGE==='set')?PAGE:'list';
 $('nav').innerHTML=TABS.map(function(t){return '<button class="'+(t[0]===tab?'act':'')+'" onclick="'+(t[0]==='list'?'go(\'list\',\'workers\')':'go(\''+t[0]+'\')')+'">'+t[1]+'</button>'}).join('');
 $('bk').classList.toggle('hide',!(PAGE==='inv'||PAGE==='party'||(PAGE==='list'&&PK==='dealers')));
 if(!ready()){setPg('ডিলার হিসাব','<div class="card sub" style="text-align:center;padding:28px">লোড হচ্ছে…</div>');return}
 var f=$('fs'),keep=f&&document.activeElement===f;
 ({home:rHome,list:rList,party:rParty,inv:rInv,products:rProducts,set:rSet})[PAGE]();
 var nf=$('fs');if(keep&&nf){nf.focus();nf.setSelectionRange(nf.value.length,nf.value.length)}
}
function setPg(t,h,fab){$('ttl').textContent=t;$('pg').innerHTML=h+(fab?'<button class="fab" onclick="'+fab+'">+</button>':'')}
function bar(k,t,v,c){return '<div class="big '+c+' bar" onclick="go(\'list\',\''+k+'\')"><div><small>'+t+'</small><b>'+money(v)+'</b></div><span>›</span></div>'}
function rHome(){var t={workers:0,dealers:0};['workers','dealers'].forEach(function(k){C[k].forEach(function(p){var d=calc(k,p).due;if(d>0)t[k]+=d})});
 setPg('ডিলার হিসাব',bar('dealers','ডিলার মোট বাকি',t.dealers,'d')+bar('workers','গ্রাহক মোট বাকি',t.workers,'c'))}
function rList(){var k=PK,dl=k==='dealers',q=(FS||'').toLowerCase(),l=sorted(C[k],'name').filter(function(p){return !q||(p.name||'').toLowerCase().indexOf(q)>-1||(p.phone||'').indexOf(q)>-1}),
 h='<input class="srch" id="fs" placeholder="🔍 '+(dl?'কোম্পানি':'গ্রাহক')+' খুঁজুন…" value="'+esc(FS)+'" oninput="FS=this.value;render()"><div class="card" style="padding:6px"><table><tr><th>'+(dl?'কোম্পানির':'গ্রাহকের')+' নাম</th><th style="text-align:right">মোট বাকি</th><th></th></tr>';
 if(!l.length)h+='<tr><td colspan=3 class="sub">'+(dl?'কোনো কোম্পানি নেই':'কোনো গ্রাহক নেই')+'</td></tr>';
 l.forEach(function(p){var d=calc(k,p).due;h+='<tr><td><span class="nm" onclick="go(\'party\',\''+k+'\',\''+p.id+'\')">'+esc(p.name)+'</span></td><td class="'+(d>0?'red':'grn')+'" style="text-align:right;white-space:nowrap">'+money(d)+'</td><td class="tb"><button class="ib" onclick="wForm(\''+p.id+'\')">✎</button><button class="ib" onclick="delW(\''+p.id+'\')">🗑</button></td></tr>'});
 setPg(dl?'ডিলার মোট বাকি':'গ্রাহক মোট বাকি',h+'</table></div>','wForm()')}
function rParty(){var k=PK,p=find(k,PID);if(!p){go('list',k);return}var c=calc(k,p),
 h='<div class="big '+(k==='dealers'?'d':'c')+'"><small>মোট বাকি</small><b>'+money(c.due)+'</b>'+((+p.opening)?'<small style="margin-top:4px">পূর্বের বাকি ধরা আছে: '+money(p.opening)+'</small>':'')+'</div><div class="two" style="margin-bottom:10px"><div class="btn g" onclick="invForm()">+ নতুন চালান</div><div class="btn o" onclick="payForm()">জমা</div></div><div class="card" style="padding:6px"><table class="fx"><tr><th>তারিখ</th><th>চালান নং</th><th class="r">মোট টাকা</th><th class="r">জমা</th><th class="r">বাকি</th></tr>';
 if(!c.rows.length)h+='<tr><td colspan=5 class="sub">এখনো কোনো চালান নেই</td></tr>';
 c.rows.forEach(function(r){var e=r.e;h+='<tr class="cl" onclick="go(\'inv\',\''+k+'\',\''+p.id+'\',\''+e.id+'\')"><td class="d">'+dshow(e.day)+'</td><td>'+esc(bn(e.no))+'</td><td class="r">'+num(e.total)+'</td><td class="r grn">'+num(r.paid)+'</td><td class="r '+(r.due>0?'red':'grn')+'">'+num(r.due)+'</td></tr>'});
 setPg(p.name,h+'</table></div>')}
function rInv(){var k=PK,p=find(k,PID),e=C[K[k].e].find(function(x){return x.id===IID});if(!p||!e){go('party',k,PID);return}
 var r=calc(k,p).rows.filter(function(x){return x.e.id===e.id})[0],py=ents(k,PID).filter(function(q){return q.type==='payment'&&String(q.inv)===String(e.no)}).sort(function(a,b){return a.ts-b.ts}),
 h='<div class="card"><div class="row"><b>'+esc(p.name)+'</b><span class="sub">'+dshow(e.day)+'</span></div><table class="fx"><tr><th>পণ্যের নাম</th><th class="r">পরিমাণ</th><th class="r">দর</th><th class="r">মোট</th></tr>'+(e.items||[]).map(function(x){return '<tr><td><b>'+esc(x.name)+'</b></td><td class="r">'+bn(x.qty)+'</td><td class="r">'+num(x.price)+'</td><td class="r">'+num(x.price*x.qty)+'</td></tr>'}).join('')+'</table></div>'
 +'<div class="card"><div class="row"><span>মোট টাকা</span><b>'+money(e.total)+'</b></div><div class="row"><span>চালানের সাথে জমা</span><span class="grn">'+money(e.paid)+'</span></div>'+py.map(function(q){return '<div class="row"><span>জমা — '+dshow(q.day)+'</span><span><span class="grn">'+money(q.amount)+'</span> <button class="ib" style="font-size:14px" onclick="delE(\''+q.id+'\')">🗑</button></span></div>'}).join('')+'<div class="row"><b>বাকি</b><b class="'+(r.due>0?'red':'grn')+'">'+money(r.due)+'</b></div></div><button class="btn r" style="width:100%" onclick="delInv(\''+e.id+'\')">চালান মুছুন</button>';
 setPg('চালান নং '+bn(e.no),h)}
function rProducts(){
 var q=(FS||'').toLowerCase(),l=sorted(P,'name').filter(function(p){return !q||(p.name||'').toLowerCase().indexOf(q)>-1});
 var h='<input class="srch" id="fs" placeholder="🔍 পণ্য খুঁজুন…" value="'+esc(FS)+'" oninput="FS=this.value;render()"><div class="card" style="padding:6px 6px"><table><tr><th>ক্রমিক</th><th>পণ্য</th><th>দাম</th><th></th></tr>';
 if(!l.length)h+='<tr><td colspan=4 class="sub">কোনো পণ্য নেই</td></tr>';
 l.forEach(function(p,i){h+='<tr><td>'+bn(i+1)+'</td><td><b>'+esc(p.name)+'</b></td><td>'+money(p.price)+'</td><td class="tb"><button class="ib" onclick="pForm(\''+p.id+'\')">✎</button><button class="ib" onclick="delP(\''+p.id+'\')">🗑</button></td></tr>'});
 setPg('পণ্য',h+'</table></div><div class="sub" style="margin:0 4px">চালানে দাম বদলানো যাবে না, তালিকার দাম বসবে</div>','pForm()')
}
function rSet(){setPg('সেটিং','<div class="card"><div class="sub" style="margin-bottom:10px">ঢুকে আছেন: '+esc(U.email)+'</div><button class="btn o" style="width:100%;margin-bottom:8px" onclick="backup()">ব্যাকআপ নামান</button><button class="btn r" style="width:100%" onclick="logout()">বের হন</button></div>')}
window.logout=function(){if(confirm('বের হবেন?'))auth.signOut()};
window.backup=function(){var b=new Blob([JSON.stringify({customers:C.workers,dealers:C.dealers,products:P,customerEntries:C.entries,dealerEntries:C.dentries},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dealer-hisab-backup-'+dkey(Date.now())+'.json';a.click();toast('ব্যাকআপ নামানো হয়েছে')};
/* ---------- মডাল ---------- */
function openM(h){$('modal').innerHTML='<div class="sheet">'+h+'</div>';$('modal').classList.remove('hide')}
window.closeM=function(){$('modal').classList.add('hide');$('modal').innerHTML=''};
function mhead(t){return '<h3><span>'+t+'</span><span onclick="closeM()" style="cursor:pointer">✕</span></h3>'}
/* গ্রাহক / ডিলার */
window.wForm=function(id){var p=id?find(PK,id):{name:'',phone:'',address:'',opening:0},t=PK==='dealers'?'কোম্পানি':'গ্রাহক';
 openM(mhead(id?t+' সম্পাদনা':'নতুন '+t)+'<div class="fg"><label>নাম</label><input id="wn" value="'+esc(p.name)+'"></div><div class="fg"><label>মোবাইল</label><input id="wp" type="tel" value="'+esc(p.phone||'')+'"></div><div class="fg"><label>ঠিকানা</label><input id="wa" value="'+esc(p.address||'')+'"></div><div class="fg"><label>পূর্বের বাকি</label><input id="wo" type="number" min="0" value="'+(+p.opening||0)+'"></div><div id="me" class="err"></div><div class="two"><div class="btn o" onclick="closeM()">বাতিল</div><div class="btn g" onclick="saveW(\''+(id||'')+'\')">সংরক্ষণ</div></div>')};
window.saveW=function(id){var n=$('wn').value.trim(),p=$('wp').value.trim();if(!n){$('me').textContent='নাম দিন';return}
 if(C[PK].some(function(x){return x.id!==id&&x.name===n&&(x.phone||'')===p})){$('me').textContent='এই নামে আগে আছে';return}
 var d={name:n,phone:p,address:$('wa').value.trim(),opening:Math.max(0,+$('wo').value||0)},c=base.collection(PK);
 (id?c.doc(id).update(d):c.add(d)).catch(function(){toast('সেভ হয়নি, আবার চেষ্টা করুন')});closeM();toast(id?'আপডেট হয়েছে':'যোগ হয়েছে')};
window.delW=function(id){var p=find(PK,id),en=ents(PK,id);
 if(!confirm(p.name+' কে মুছবেন?'+(en.length?'\n\nতার '+bn(en.length)+'টি লেনদেনও মুছে যাবে।':'')))return;
 en.forEach(function(e){base.collection(K[PK].e).doc(e.id).delete().catch(function(){})});base.collection(PK).doc(id).delete().catch(function(){});toast('মুছে ফেলা হয়েছে')};
/* পণ্য */
window.pForm=function(id){var p=id?P.find(function(x){return x.id===id}):{name:'',price:''};
 openM(mhead(id?'পণ্য সম্পাদনা':'নতুন পণ্য')+'<div class="fg"><label>পণ্যের নাম</label><input id="pn" value="'+esc(p.name)+'"></div><div class="fg"><label>দাম (টাকা)</label><input id="pr" type="number" min="0" value="'+esc(p.price)+'"></div><div id="me" class="err"></div><div class="two"><div class="btn o" onclick="closeM()">বাতিল</div><div class="btn g" onclick="saveP(\''+(id||'')+'\')">সংরক্ষণ</div></div>')};
window.saveP=function(id){var n=$('pn').value.trim(),v=$('pr').value;if(!n||v===''||+v<0){$('me').textContent='নাম ও দাম দিন';return}
 if(P.some(function(x){return x.id!==id&&x.name===n})){$('me').textContent='এই নামে আগে আছে';return}
 var d={name:n,price:+v};(id?base.collection('products').doc(id).update(d):base.collection('products').add(d)).catch(function(){});closeM();toast(id?'আপডেট হয়েছে':'পণ্য যোগ হয়েছে')};
window.delP=function(id){if(confirm('পণ্যটি মুছবেন? পুরোনো চালান ঠিক থাকবে'))base.collection('products').doc(id).delete().catch(function(){})};
/* চালান */
var II=[],IW=null;
window.invForm=function(){II=[];
 openM(mhead('নতুন চালান')+'<div class="two"><div class="fg"><label>তারিখ</label><input id="idt" type="date" value="'+dkey(Date.now())+'"></div><div class="fg"><label>চালান নং</label><input id="ino" autocomplete="off"></div></div><div class="fg" style="margin-bottom:0"><label>পণ্য খুঁজুন</label><input id="is" placeholder="নাম লিখুন…" oninput="isr()" onfocus="isr()" autocomplete="off"></div><div id="idd" class="dd hide"></div><div id="ir" style="margin:8px 0"></div><div class="row" style="font-size:16px"><b>মোট টাকা</b><b id="it">'+money(0)+'</b></div><div class="fg" style="margin-top:6px"><label>জমা</label><input id="ip" type="number" min="0" value="0" oninput="ic()"></div><div class="row" style="font-size:16px"><b>বাকি</b><b class="red" id="id">'+money(0)+'</b></div><div id="me" class="err"></div><div class="two"><div class="btn o" onclick="closeM()">বাতিল</div><div class="btn g" onclick="saveInv()">সংরক্ষণ</div></div>')};
window.isr=function(){var q=$('is').value.trim().toLowerCase(),l=sorted(P,'name').filter(function(p){return !q||p.name.toLowerCase().indexOf(q)>-1}),d=$('idd');
 d.innerHTML=l.length?l.map(function(p){return '<div onclick="ia(\''+p.id+'\')"><span>'+esc(p.name)+'</span><b>'+money(p.price)+'</b></div>'}).join(''):'<div class="sub">পণ্য পাওয়া যায়নি</div>';d.classList.remove('hide')};
window.ia=function(pid){var p=P.find(function(x){return x.id===pid}),r=II.find(function(x){return x.pid===pid});if(r)r.qty=(+r.qty||0)+1;else II.push({pid:pid,name:p.name,price:+p.price,qty:1});$('is').value='';$('idd').classList.add('hide');ir()};
function ir(){$('ir').innerHTML=II.map(function(x,i){return '<div class="irow"><span class="n">'+esc(x.name)+'<div class="sub">'+money(x.price)+'</div></span><input type="number" min="0" step="any" value="'+x.qty+'" oninput="iq('+i+',this.value)"><span class="a" id="ia'+i+'">'+money(x.price*x.qty)+'</span><button class="ib" onclick="idl('+i+')">✕</button></div>'}).join('');ic()}
window.iq=function(i,v){II[i].qty=+v||0;$('ia'+i).textContent=money(II[i].price*II[i].qty);ic()};
window.idl=function(i){II.splice(i,1);ir()};
function itot(){return II.reduce(function(s,x){return s+x.price*x.qty},0)}
window.ic=function(){var t=itot(),p=+($('ip').value||0);$('it').textContent=money(t);$('id').textContent=money(Math.max(0,t-p))};
window.saveInv=function(){var its=II.filter(function(x){return x.qty>0}),t=itot(),p=+($('ip').value||0),no=$('ino').value.trim(),k=$('idt').value;
 if(!k){$('me').textContent='তারিখ দিন';return}if(!no){$('me').textContent='চালান নং দিন';return}
 if(calc(PK,find(PK,PID)).rows.some(function(r){return String(r.e.no)===no})){$('me').textContent='এই চালান নং আগে আছে';return}
 if(!its.length){$('me').textContent='অন্তত একটি পণ্য বাছুন';return}
 if(p<0||p>t){$('me').textContent='জমা মোট টাকার চেয়ে বেশি হতে পারে না';return}
 base.collection(K[PK].e).add({type:'invoice',wid:PID,no:no,items:its.map(function(x){return {name:x.name,price:x.price,qty:x.qty}}),total:t,paid:p,ts:new Date(k+'T12:00:00').getTime(),day:k}).catch(function(){toast('সেভ হয়নি, আবার চেষ্টা করুন')});closeM();toast('চালান সংরক্ষণ হয়েছে')};
/* জমা */
window.payForm=function(){var r=calc(PK,find(PK,PID)).rows.filter(function(x){return x.due>0});
 if(!r.length){toast('বাকি আছে এমন কোনো চালান নেই');return}
 openM(mhead('জমা')+'<div class="fg"><label>চালান নং</label><select id="pi" onchange="pc()">'+r.map(function(x){return '<option value="'+esc(x.e.no)+'" data-d="'+x.due+'">'+esc(bn(x.e.no))+' — বাকি '+money(x.due)+'</option>'}).join('')+'</select></div><div class="fg"><label>কত টাকা জমা</label><input id="pa" type="number" min="0" oninput="pc()"></div><div class="fg"><label>তারিখ</label><input id="pd" type="date" value="'+dkey(Date.now())+'"></div><div class="row" style="font-size:15px"><span>জমার পরে এই চালানের বাকি</span><b id="pl"></b></div><div id="me" class="err"></div><div class="two"><div class="btn o" onclick="closeM()">বাতিল</div><div class="btn g" onclick="savePay()">সংরক্ষণ</div></div>');pc()};
window.pc=function(){var o=$('pi').selectedOptions[0];$('pl').textContent=money((+o.getAttribute('data-d'))-(+$('pa').value||0))};
window.savePay=function(){var o=$('pi').selectedOptions[0],d=+o.getAttribute('data-d'),a=+$('pa').value,k=$('pd').value;
 if(!(a>0)){$('me').textContent='টাকার পরিমাণ দিন';return}if(a>d){$('me').textContent='এই চালানের বাকির চেয়ে বেশি জমা নেওয়া যাবে না';return}if(!k){$('me').textContent='তারিখ দিন';return}
 base.collection(K[PK].e).add({type:'payment',wid:PID,inv:o.value,amount:a,ts:new Date(k+'T12:00:00').getTime(),day:k}).catch(function(){toast('সেভ হয়নি, আবার চেষ্টা করুন')});closeM();toast('জমা সংরক্ষণ হয়েছে')};
window.delE=function(id){if(confirm('এই জমাটি মুছবেন? চালানের বাকি বদলে যাবে।'))base.collection(K[PK].e).doc(id).delete().catch(function(){})};
window.delInv=function(id){var e=C[K[PK].e].find(function(x){return x.id===id}),py=ents(PK,PID).filter(function(q){return q.type==='payment'&&String(q.inv)===String(e.no)});
 if(!confirm('চালান নং '+e.no+' মুছবেন?'+(py.length?'\n\nএর '+bn(py.length)+'টি জমাও মুছে যাবে।':'')))return;
 py.concat([e]).forEach(function(x){base.collection(K[PK].e).doc(x.id).delete().catch(function(){})});go('party',PK,PID);toast('চালান মুছে ফেলা হয়েছে')};
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
